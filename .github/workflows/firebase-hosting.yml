name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image tools
        run: python3 -m pip install --quiet pillow

      - name: Apply V68 polish
        run: python3 scripts/polish_v68.py

      - name: Clarify partner metrics
        run: python3 scripts/postprocess_v68_clarity.py

      - name: Save V68 fixes to source
        run: |
          if ! git diff --quiet -- public/index.html public/assets/buru-hero-transparent.webp; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/index.html public/assets/buru-hero-transparent.webp
            git commit -m "Apply V68 partner clarity [skip ci]"
            git push
          fi

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MACHIKOGA_E8FC9 }}'
          channelId: live
          projectId: machikoga-e8fc9
