name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image tools
        run: python3 -m pip install --quiet pillow

      - name: Prepare portal wording for legacy polish step
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('小金井ポータル', '小金井専用ポータルサイト')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply final master polish
        run: python3 scripts/final_master_polish.py

      - name: Add SNS course and seminar section
        run: python3 scripts/add_other_services.py

      - name: Apply final copy pass
        run: python3 scripts/final_copy_pass.py

      - name: Polish WHY NOW and AI value sections
        run: python3 scripts/polish_why_ai_final.py

      - name: Finalize exact AI section
        run: python3 scripts/finalize_ai_section_exact.py

      - name: Apply local price copy
        run: python3 scripts/update_local_price_copy.py

      - name: Fix mobile horizontal overflow
        run: python3 scripts/fix_mobile_overflow.py

      - name: Put Buru first in partner section
        run: python3 scripts/reorder_partners_buru_first.py

      - name: Final responsive cleanup
        run: python3 scripts/final_layout_cleanup.py

      - name: Add Instagram and Google strategy section
        run: python3 scripts/add_dual_platform_section.py

      - name: Finalize menu and page structure
        run: python3 scripts/final_structure_menu_cleanup.py

      - name: Final mobile finish
        run: python3 scripts/final_mobile_finish.py

      - name: Build downloadable V68 backup
        run: |
          mkdir -p exports
          rm -f exports/machikoga_V68_complete_2026-09-10.zip
          zip -r -q exports/machikoga_V68_complete_2026-09-10.zip \
            public firebase.json scripts docs .github FINAL_POLISH_SPEC.md \
            -x '*.DS_Store' '*.git*'

      - name: Save final master changes and backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/assets/buru-hero-navy.webp || true
          git add -f exports/machikoga_V68_complete_2026-09-10.zip
          if ! git diff --cached --quiet; then
            git commit -m "Polish mobile stats and strategy copy [skip ci]"
            git push
          fi

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MACHIKOGA_E8FC9 }}'
          channelId: live
          projectId: machikoga-e8fc9
