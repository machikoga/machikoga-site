name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build V68 homepage
        run: cat .v68build/part*.b64 | base64 -d | gzip -d > public/index.html

      - name: Verify V68 homepage
        run: |
          grep -q 'name="machikoga-version" content="V68"' public/index.html
          grep -q '<body>' public/index.html
          grep -q '</html>' public/index.html
          test "$(wc -c < public/index.html)" -gt 90000

      - name: Commit generated V68 source
        run: |
          if ! git diff --quiet -- public/index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/index.html
            git commit -m "Build V68 homepage"
            git push
          fi

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MACHIKOGA_E8FC9 }}'
          channelId: live
          projectId: machikoga-e8fc9
