name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image tools
        run: python3 -m pip install --quiet pillow

      - name: Apply final master polish
        run: python3 scripts/final_master_polish.py

      - name: Add SNS course and seminar section
        run: python3 scripts/add_other_services.py

      - name: Apply final copy pass
        run: python3 scripts/final_copy_pass.py

      - name: Polish WHY NOW and AI value sections
        run: python3 scripts/polish_why_ai_final.py

      - name: Apply local price copy
        run: python3 scripts/update_local_price_copy.py

      - name: Save final master changes
        run: |
          if ! git diff --quiet -- public/index.html public/assets/buru-hero-navy.webp; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/index.html public/assets/buru-hero-navy.webp
            git commit -m "Apply V68 local price copy [skip ci]"
            git push
          fi

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MACHIKOGA_E8FC9 }}'
          channelId: live
          projectId: machikoga-e8fc9
