name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image tools
        run: python3 -m pip install --quiet pillow

      - name: Replace drone samples with HQ versions
        run: |
          curl -L --fail --retry 2 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-cd04-8209-9d7c-3d14d58176b4/raw?se=2026-09-29T17%3A57%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=3d958b3b-a8bb-500e-8da2-e16f790512b6&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T03%3A50%3A43Z&ske=2026-09-30T03%3A50%3A43Z&sks=b&skv=2026-02-06&sig=4KpBSew9l1N52Q3Xm9MbxkVC52MwvxDdixyOHZn1938%3D' -o public/videos/yokota-indoor-drone-sample.mp4
          curl -L --fail --retry 2 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-6490-8209-9db6-814047b69a22/raw?se=2026-09-29T17%3A57%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=777fd2e2-b98d-5ab3-86b9-348a13f62da0&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T07%3A04%3A54Z&ske=2026-09-30T07%3A04%3A54Z&sks=b&skv=2026-02-06&sig=8fu7zOosgoLJGjiMWD/GlsY/r4ypbJ%2BY3sPUOpCkjfE%3D' -o public/videos/yokota-higashimurayama-drone-sample.mp4
          ls -lh public/videos/yokota-*.mp4

      - name: Prepare portal wording for legacy polish step
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('小金井ポータル', '小金井専用ポータルサイト')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply final master polish
        run: python3 scripts/final_master_polish.py

      - name: Add SNS course and seminar section
        run: python3 scripts/add_other_services.py

      - name: Apply final copy pass
        run: python3 scripts/final_copy_pass.py

      - name: Polish WHY NOW and AI value sections
        run: python3 scripts/polish_why_ai_final.py

      - name: Finalize exact AI section
        run: python3 scripts/finalize_ai_section_exact.py

      - name: Apply local price copy
        run: python3 scripts/update_local_price_copy.py

      - name: Fix mobile horizontal overflow
        run: python3 scripts/fix_mobile_overflow.py

      - name: Put Buru first in partner section
        run: python3 scripts/reorder_partners_buru_first.py

      - name: Final responsive cleanup
        run: python3 scripts/final_layout_cleanup.py

      - name: Add Instagram and Google strategy section
        run: python3 scripts/add_dual_platform_section.py

      - name: Finalize menu and page structure
        run: python3 scripts/final_structure_menu_cleanup.py

      - name: Final mobile finish
        run: python3 scripts/final_mobile_finish.py

      - name: Remove public price amounts
        run: python3 scripts/remove_price_amounts.py

      - name: Promote success cases
        run: python3 scripts/promote_success_cases.py

      - name: Visualize service pillars
        run: python3 scripts/visualize_service_pillars.py

      - name: Apply final requested refinements
        run: python3 scripts/final_requested_refinement.py

      - name: Optimize Hosting bandwidth
        run: python3 scripts/optimize_hosting_bandwidth.py

      - name: Add Yokota drone samples
        run: python3 scripts/add_yokota_drone_samples.py

      - name: Build downloadable V68 backup
        run: |
          mkdir -p exports
          rm -f exports/machikoga_V68_complete_2026-09-10.zip
          zip -r -q exports/machikoga_V68_complete_2026-09-10.zip \
            public firebase.json scripts docs .github FINAL_POLISH_SPEC.md \
            -x '*.DS_Store' '*.git*'

      - name: Save final master changes and backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/assets/buru-hero-navy.webp public/videos/yokota-indoor-drone-sample.mp4 public/videos/yokota-higashimurayama-drone-sample.mp4 || true
          if ! git diff --cached --quiet; then
            git commit -m "Upgrade drone sample video quality [skip ci]"
            git push
          fi

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MACHIKOGA_E8FC9 }}'
          channelId: live
          projectId: machikoga-e8fc9
