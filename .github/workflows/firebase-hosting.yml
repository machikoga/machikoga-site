name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply final V68 visual emphasis
        run: python3 scripts/final_visual_emphasis.py

      - name: Save final V68 visual changes
        run: |
          if ! git diff --quiet -- public/index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/index.html
            git commit -m "Apply V68 visual emphasis [skip ci]"
            git push
          fi

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MACHIKOGA_E8FC9 }}'
          channelId: live
          projectId: machikoga-e8fc9
