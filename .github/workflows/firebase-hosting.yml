name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image tools
        run: python3 -m pip install --quiet pillow

      - name: Apply V68 automatic UI fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import deque
          from PIL import Image
          import re

          # Build a dedicated transparent hero image from the existing mascot artwork.
          src = Path('public/assets/buru-v67.webp')
          dst = Path('public/assets/buru-hero-transparent.webp')
          im = Image.open(src).convert('RGBA')
          px = im.load()
          w, h = im.size

          def is_bg(x, y):
              r, g, b, a = px[x, y]
              return a == 0 or (r >= 210 and g >= 210 and b >= 210)

          q = deque()
          seen = set()
          for x in range(w):
              for y in (0, h - 1):
                  if is_bg(x, y):
                      q.append((x, y)); seen.add((x, y))
          for y in range(h):
              for x in (0, w - 1):
                  if is_bg(x, y):
                      q.append((x, y)); seen.add((x, y))

          while q:
              x, y = q.popleft()
              r, g, b, a = px[x, y]
              px[x, y] = (r, g, b, 0)
              for nx, ny in ((x-1,y),(x+1,y),(x,y-1),(x,y+1)):
                  if 0 <= nx < w and 0 <= ny < h and (nx, ny) not in seen and is_bg(nx, ny):
                      seen.add((nx, ny)); q.append((nx, ny))

          bbox = im.getbbox()
          if bbox:
              l, t, r, b = bbox
              pad = 10
              l = max(0, l-pad); t = max(0, t-pad); r = min(w, r+pad); b = min(h, b+pad)
              im = im.crop((l, t, r, b))
          im.save(dst, 'WEBP', quality=88, method=6)

          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')

          # Suzuki portrait: keep the fresh asset request.
          s = re.sub(r'assets/partners/suzuki\.webp\?v=[0-9-]+', 'assets/partners/suzuki.webp?v=20260910-8', s)

          # Hero mascot: use the generated transparent asset.
          s = re.sub(
              r'(<img class="hero-buru" src=")[^"]+(" alt="まちこが ぶる">)',
              r'\1assets/buru-hero-transparent.webp?v=20260910-1\2',
              s,
              count=1
          )

          # Keep transparent framing on desktop/mobile.
          s = re.sub(
              r'\.hero-buru\{width:min\(380px,92%\);height:430px;[^}]*\}',
              '.hero-buru{width:min(380px,92%);height:430px;object-fit:contain;object-position:center center;border-radius:0;border:0;background:transparent;box-shadow:none}',
              s,
              count=1
          )
          s = re.sub(
              r'\.hero-buru\{width:210px;height:245px;[^}]*\}',
              '.hero-buru{width:210px;height:245px;border-radius:0;object-fit:contain;background:transparent;border:0;box-shadow:none}',
              s,
              count=1
          )

          # Brand acronym: BURU -> BUL everywhere it is shown as uppercase text.
          s = s.replace('BURU', 'BUL')

          # Mobile polish: make the fixed LINE / Instagram bar less intrusive.
          s = re.sub(
              r'\.mobile-dock\{position:fixed;left:10px;right:10px;bottom:10px;z-index:120;display:none;gap:8px\}',
              '.mobile-dock{position:fixed;left:12px;right:12px;bottom:max(8px,env(safe-area-inset-bottom));z-index:120;display:none;gap:6px}',
              s,
              count=1
          )
          s = re.sub(
              r'\.mobile-dock a\{flex:1;min-height:48px;font-size:\.82rem;padding:0 10px\}',
              '.mobile-dock a{flex:1;min-height:42px;font-size:.76rem;padding:0 8px;box-shadow:0 8px 20px rgba(3,18,42,.18)}',
              s,
              count=1
          )
          s = s.replace('.section{padding:72px 0}', '.section{padding:66px 0}')
          s = s.replace('footer{padding-bottom:82px}', 'footer{padding-bottom:68px}')

          p.write_text(s, encoding='utf-8')

          if not dst.exists() or dst.stat().st_size == 0:
              raise SystemExit('Transparent mascot asset was not generated')
          if 'assets/buru-hero-transparent.webp?v=20260910-1' not in s:
              raise SystemExit('Hero mascot source was not updated')
          if 'assets/partners/suzuki.webp?v=20260910-8' not in s:
              raise SystemExit('Suzuki cache-bust replacement was not applied')
          if 'BURU' in s:
              raise SystemExit('BURU remains in public/index.html')
          if 'BUL / LOCAL SNS' not in s:
              raise SystemExit('BUL label replacement was not applied')
          PY

      - name: Save V68 fixes to source
        run: |
          if ! git diff --quiet -- public/index.html public/assets/buru-hero-transparent.webp; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/index.html public/assets/buru-hero-transparent.webp
            git commit -m "Apply V68 BUL and mobile polish [skip ci]"
            git push
          fi

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MACHIKOGA_E8FC9 }}'
          channelId: live
          projectId: machikoga-e8fc9
